name: Eden (Widgets)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      version: 6.11.3
      submodules: qtbase,qttools,qtcharts

  release:
    needs: build
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      version: 6.11.3
      release: true
      repo: Eden-CI/Qt
